name: Notable contributions

on:
  schedule:
    - cron: "0 3 * * *" # 每天刷新一次
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check token configured
        id: tok
        run: echo "has=${{ secrets.METRICS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: lowlighter/metrics@latest
        if: steps.tok.outputs.has == 'true'
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yuee3
          filename: metrics.plugin.notable.svg
          base: ""
          plugin_notable: yes
          plugin_notable_indepth: yes # 显示每个仓库的 PR / commit 明细
          plugin_notable_repositories: yes # 显示完整仓库名
